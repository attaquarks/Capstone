# docker-compose.yaml — multi-service orchestration for the
# Supply Chain Intelligence Agent.
#
# Run from the repository root:
#   docker compose -f docker/docker-compose.yaml up -d --build
#
# Services:
#   chromadb       — vector database (the "backing data store").
#   agent-ingest   — one-shot job that seeds the vector index on first run.
#   agent-api      — the FastAPI agent (depends on the ingest job finishing).
#
# Persistence:
#   chroma-data       — vector index (survives `docker compose down`).
#   checkpoint-data   — the agent's SQLite checkpoint DB + feedback log.
#
# Secrets:
#   No secrets are baked into any image. They are injected at *runtime* via
#   `env_file: ../.env` (host file, not in the image — see .dockerignore) plus
#   explicit `${VAR}` substitution from the host shell. Run with e.g.
#       GEMINI_API_KEY=... docker compose -f docker/docker-compose.yaml up -d
#   or place GEMINI_API_KEY=... in a local .env file at the repo root.

services:
  # ------------------------------------------------------------------
  # Vector database — the second mandatory service.
  # ------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: supply-chain-chromadb
    # Intentionally NOT publishing 8000 to the host: the agent reaches it via
    # the internal Docker network. Uncomment under `ports:` for local debugging.
    # ports:
    #   - "8001:8000"
    expose:
      - "8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      # `chromadb/chroma:0.5.x` exposes /api/v2/heartbeat. Use a tiny Python
      # one-liner so we don't depend on curl being present in the upstream image.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ------------------------------------------------------------------
  # One-shot ingestion job: populates the vector DB on first start. Idempotent
  # — re-running just rebuilds the collection from data/.
  # ------------------------------------------------------------------
  agent-ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: capstone-agent:latest
    container_name: supply-chain-agent-ingest
    depends_on:
      chromadb:
        condition: service_healthy
    environment:
      # The factory in src/core/llm_factory.py picks Groq if GROQ_API_KEY is set,
      # else falls back to Gemini. Secrets are injected via env_file (../.env)
      # at runtime, never baked into the image. Override AGENT_MODEL / JUDGE_MODEL
      # / LLM_PROVIDER from the host by adding them to .env or by exporting them
      # before `docker compose up`; the factory coalesces empty strings to defaults.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      PYTHONPATH: /app
    env_file:
      - path: ../.env
        required: false
    networks:
      - agent-network
    # Override entrypoint to run ingestion once and exit.
    entrypoint: ["/usr/bin/tini", "--", "/app/docker/entrypoint.sh"]
    command: ["python", "-m", "src.ingestion.ingest_data"]
    restart: "no"

  # ------------------------------------------------------------------
  # Agent API — FastAPI service that exposes /chat, /stream, /health.
  # ------------------------------------------------------------------
  agent-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: capstone-agent:latest
    container_name: supply-chain-agent
    ports:
      - "8000:8000"
    environment:
      # Same secret-injection contract as agent-ingest above. Model / provider
      # overrides flow in through .env or the host environment via env_file;
      # the factory coalesces empty strings to per-provider defaults.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHECKPOINT_DB_PATH: /app/runtime/checkpoint_db.sqlite
      PYTHONPATH: /app
    env_file:
      - path: ../.env
        required: false
    volumes:
      - checkpoint-data:/app/runtime
    depends_on:
      chromadb:
        condition: service_healthy
      agent-ingest:
        condition: service_completed_successfully
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

# Persistent volumes — both survive `docker compose down` (only `down -v`
# removes them). Verified in the breaking-change demo.
volumes:
  chroma-data:
    driver: local
  checkpoint-data:
    driver: local

networks:
  agent-network:
    driver: bridge
