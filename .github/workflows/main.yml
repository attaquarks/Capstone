# Lab 10: Agentic CI/CD Pipeline - GitHub Actions
# Automated Quality Gate: Treats "Faithfulness" like a unit test.
# If a code change makes the agent hallucinate, the pipeline FAILS.

name: Agent Evaluation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  evaluate-agent:
    name: Build & Evaluate Agent Quality
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python environment
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the Headless Eval Script
      # Uses GitHub Secrets for API keys (never hardcoded)
      - name: Run Agent Evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TEST_DATASET_PATH: ./test_dataset.json
          EVAL_THRESHOLD_PATH: ./eval_threshold_config.json
        run: |
          echo "Running evaluation pipeline..."
          python run_eval.py
          echo "Evaluation complete. Exit code: $?"

      # Step 5: Upload evaluation report as artifact
      - name: Upload Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation_report.md
          retention-days: 30

      # Step 6: Comment on PR with results (if PR)
      - name: Post Results to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Evaluation report not available.';
            try {
              report = fs.readFileSync('evaluation_report.md', 'utf8');
            } catch (e) {
              report = 'Failed to read evaluation report.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Agent Evaluation Results\n\n${report}`
            });
