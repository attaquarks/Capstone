# Automated Quality Gate for the Supply Chain Intelligence Agent.
#
# Triggers on every push and PR to `main`. The pipeline:
#   1. Checks out the code.
#   2. Installs dependencies (cached on requirements.txt).
#   3. Runs the headless evaluation script (`run_eval.py`).
#   4. Surfaces a clear pass/fail signal via the script's exit code.
#   5. Uploads `eval_results.json` and `evaluation_report.md` as artifacts.
#
# Secrets policy:
#   * GEMINI_API_KEY MUST be configured in the repo's GitHub Actions secret
#     store. It is injected only at runtime; nothing is committed or baked.
#   * If the secret is missing (e.g. PR from a fork), we degrade gracefully
#     to the lint/import job which still validates plumbing without burning
#     the API quota.

name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------
  # Job 1 — Always runs. Validates that the eval script imports cleanly
  # and that the threshold config is well-formed JSON. Cheap, no LLM calls.
  # Useful for fork PRs where the GEMINI_API_KEY secret is unavailable.
  # ---------------------------------------------------------------
  lint-and-syntax:
    name: Lint, syntax & config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate threshold JSON schema
        run: python scripts/validate_thresholds.py

      - name: Compile-check eval script
        run: python -m py_compile evaluation/run_eval.py

  # ---------------------------------------------------------------
  # Job 2 — The real quality gate. Runs the full evaluation against
  # live Gemini and blocks the build if any metric falls below threshold.
  # ---------------------------------------------------------------
  evaluate-agent:
    name: Evaluate agent quality
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    # Skip on forked PRs — they cannot access secrets, so the live eval
    # would fail with a confusing "no API key" error instead of a useful
    # quality-gate signal.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation (smoke slice)
        env:
          # Both LLM providers are accepted; whichever secret is configured
          # in the repo determines the backend. Empty values are passed
          # through harmlessly (the provider-selection logic in
          # llm_factory.py keys off whichever variable is non-empty).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          TEST_DATASET_PATH: ./tests/test_dataset.json
          EVAL_THRESHOLD_PATH: ./evaluation/eval_thresholds.json
          EVAL_RESULTS_PATH: ./evaluation/eval_results.json
          EVAL_REPORT_PATH: ./evaluation/evaluation_report.md
          PYTHONPATH: ${{ github.workspace }}
          EVAL_SMOKE: "1"
          EVAL_SMOKE_SIZE: "3"
        run: |
          if [ -z "${GEMINI_API_KEY}" ] && [ -z "${GROQ_API_KEY}" ]; then
            echo "::error::Neither GEMINI_API_KEY nor GROQ_API_KEY is configured. Add one under Settings -> Secrets -> Actions."
            exit 1
          fi
          python -m evaluation.run_eval
          echo "exit_code=$?"

      - name: Summarise results
        if: always()
        env:
          EVAL_RESULTS_PATH: ./evaluation/eval_results.json
        run: python scripts/summarise_eval.py

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.run_id }}
          path: |
            evaluation/eval_results.json
            evaluation/evaluation_report.md
          retention-days: 30

      - name: Comment evaluation result on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Quality Gate (run ' + context.runId + ')\n\n';
            try {
              const data = JSON.parse(fs.readFileSync('evaluation/eval_results.json', 'utf8'));
              body += `- Overall: **${data.overall_passed ? 'PASS' : 'FAIL'}**\n`;
              body += `- Per-case pass rate: ${(data.pass_rate * 100).toFixed(1)}%\n\n`;
              body += '| Metric | Score | Threshold | Status |\n';
              body += '|--------|-------|-----------|--------|\n';
              for (const m of data.metrics) {
                body += `| ${m.name} | ${m.score.toFixed(3)} | ${m.threshold.toFixed(2)} | ${m.passed ? 'PASS' : 'FAIL'} |\n`;
              }
            } catch (e) {
              body += '`eval_results.json` not produced (build likely failed before evaluation).';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
